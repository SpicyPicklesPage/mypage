<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0a">
  <meta name="description" content="SpicyPickles 摄影档案。">
  <meta name="author" content="SpicyPickles">
  <title>SpicyPickles — Photos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0e0b'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23f2f0e8' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23c8ff3d'/%3E%3C/svg%3E">
  <style>
    :root{--paper:#f2f0e8;--acid:#c8ff3d;--line:rgba(242,240,232,.28)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0c0a;color:var(--paper)}
    body{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:16px}
    .grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .frame{min-height:100vh;padding:clamp(20px,4vw,56px);display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden;background:url('photos/2024_04_13_DSC_7370.jpg') center 56%/cover no-repeat}
    .frame::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,9,7,.42),rgba(8,9,7,.08) 42%,rgba(8,9,7,.82))}
    header{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
    .brand{font-weight:750;font-size:1rem;text-transform:none;letter-spacing:.04em}.brand i{color:var(--acid);font-style:normal}
    .count{color:rgba(242,240,232,.72)}
    main{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
    .copy p{margin:0 0 16px;color:var(--acid);font:600 .8rem/1 monospace;letter-spacing:.12em}.copy h1{font-size:clamp(4.8rem,14vw,12rem);line-height:.76;letter-spacing:-.07em;margin:0}.copy h1 span{display:block;color:transparent;-webkit-text-stroke:1px rgba(242,240,232,.72)}
    .enter{width:min(330px,34vw);min-height:170px;border:1px solid var(--line);padding:24px;color:inherit;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;background:rgba(8,9,7,.28);backdrop-filter:blur(8px);transition:.3s ease}
    .enter:hover,.enter:focus-visible{background:var(--acid);color:#0b0c0a;border-color:var(--acid);transform:translateY(-5px);outline:none}.enter b{font-size:2rem;letter-spacing:-.04em}.enter span{font-size:.9rem}.enter em{align-self:flex-end;font-size:1.5rem;font-style:normal}
    @media(max-width:720px){.frame{min-height:100svh;background-position:43% center}main{display:block}.copy h1{font-size:clamp(4.2rem,24vw,7rem)}.enter{width:100%;min-height:130px;margin-top:34px}.count{display:none}}
    @media(prefers-reduced-motion:reduce){.enter{transition:none}}
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <section class="frame">
    <header><span class="brand">SpicyPickles<i>.</i></span><span class="count">Photography Archive</span></header>
    <main>
      <div class="copy"><p>01 / ONLY LIGHT REMAINS</p><h1>照<span>片</span></h1></div>
      <a class="enter" href="photo-v2.html"><span>城市、自然与置身其外的观看</span><b>进入影像</b><em aria-hidden="true">↗</em></a>
    </main>
  </section>
</body>
</html>
