<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .gallery img { max-width: 200px; border: 1px solid #ccc; padding: 5px; background: #f8f8f8; }
    </style>
</head>
<body>
    <h1>Photo Gallery</h1>
    <div class="gallery">
        <img src="DSC_0303.jpg" alt="DSC_0303.jpg">
        <img src="DSC_0310.jpg" alt="DSC_0310.jpg">
        <img src="DSC_0311.jpg" alt="DSC_0311.jpg">
    </div>
</body>
</html>
